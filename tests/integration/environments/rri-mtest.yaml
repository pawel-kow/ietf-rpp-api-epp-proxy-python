# DENIC's RRI test environment, MTEST (docs/rri/refactoring.md §5.4). The machine must be on the IPv4 allowlist of
# both RegAccs.
config: config.rri-mtest.yaml          # RPP_CONFIG_FILE of the app under test: its profile, TLD, LGRs, environment name
max_workers: 4                         # MTEST allows 4 sessions per RegAcc
rpp_requests_per_minute: 25            # under the ACL of 100 RRI requests a minute: one RPP request is up to 4
regacc: login_prefix                   # the sponsor id is the RegAccId the login starts with
registrars:                            # the slots the cases name, each naming its variables in .env
  a:
    user: TEST_RRI_REGACC1
    password: TEST_RRI_REGACC1_PASSWORD
    prefix: TEST_RRI_REGACC1_PREFIX
    gen_req: TEST_RRI_REGACC1_GEN_REQ
    abuse: TEST_RRI_REGACC1_ABUSE
  b:
    user: TEST_RRI_REGACC2
    password: TEST_RRI_REGACC2_PASSWORD
    prefix: TEST_RRI_REGACC2_PREFIX
    gen_req: TEST_RRI_REGACC2_GEN_REQ
    abuse: TEST_RRI_REGACC2_ABUSE
# Not a secret: a user MTEST does not know, for the failed logins. No case logs in to a test account with a wrong
# password: 10 failed LOGINs lock a user for an hour.
unknown_user:
  user: ghost
  password: nope

# What this server does where the protocol leaves the choice to it (docs/agents/testing.project.md#selectors).
# `<object>.<field>.<leaf>` and `<object>.processes.<process>.<leaf>`, objects and fields by their RPP names.
# null: the field is not there, or the limit is not known.
facts:
  session:
    cltrid_reuse_supported: true       # a reused client transaction id is taken
  domainName:
    name:
      lgr:
        required_for_idn: false        # an IDN without an lgr is taken
        ascii_supported: true          # an lgr on a name that is not an IDN is taken
        latn_enye_supported: true      # DENIC's repertoire has ñ
    authInfo:
      min_length: 8
      upper_and_digit_required: false
      ambiguous_supported: false       # it may not hold I, O, l, o, 0 and 1
    contacts:
      foreign_supported: null          # not known
    dns:
      dnskey_supported: null           # RRI has no secDNS: DENIC computes the DS from the DNSKEY
    processes:
      create:
        success_status:                # what a domain reads with right after its create: one of these
          - pendingCreate              # the predelegation check is still running
          - ok                         # it passed (RRI `connect`): which of the two depends on timing
          - inactive                   # it failed (RRI `failed`, with a `due`)
      delete:
        readable_after: true           # a domain deleted right after its create is read in its redemption period
      restore:
        within_run: false              # the RGP lasts a day on MTEST
  contact:
    id:
      max_length: 32
    name:
      min_count: 1
      min_length: 3
      charset_restricted: false
      digits_only_supported: false     # a name of digits only, or of specials only, is refused
    email:
      min_count: 1
    street:
      min_count: 1
      max_count: null
    city:
      max_length: 80
    region:
      lower_case_supported: null       # an RRI contact has no region
    postcode:
      min_count: 1
      lower_case_supported: true
      format_by_country: true          # the postcode is checked against the format of its country
    phone:
      subscriber:
        min_length: 4                  # digits after the country code
  # Defects of this server, which the cases it breaks do not run on.
  bugs:
    over_max_length_cut: false
