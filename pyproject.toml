[tool.pytest.ini_options]
filterwarnings = [
#    "error",
    "ignore::UserWarning",
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:jsonschema.RefResolver is deprecated:DeprecationWarning',
    'ignore:jsonschema.exceptions.RefResolutionError is deprecated:DeprecationWarning',
]
testpaths = [
    "tests",
    "tests/unit",
    "tests/integration",
]
pythonpath = [
    "src",
]
# A case file of the integration suite names its markers in "markers" (docs/agents/testing.project.md).
markers = [
    "smoke: a happy path of each operation, run on every iteration: pytest -m smoke",
    "lazy_schemas: the test maps without an app, so a validator is built on first use (tests/conftest.py)",
    "pyversions: one test per native or version-sensitive dependency, run on every supported Python by test_python_versions.sh",
]
addopts = "--strict-markers --tb=short -p no:warnings"

# Module boundaries of #120, checked by `PYTHONPATH=src lint-imports` (docs/agents/architecture.project.md).
[tool.importlinter]
# main is a module, which import-linter cannot take as a root. An import of it is therefore seen as external and
# forbidden by name.
root_packages = ["api_docs", "core", "extensions", "registration", "registry_adapter", "rpp", "settings"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-stdlib-only"
name = "core imports only the standard library"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "api_docs", "main", "registry_adapter", "rpp", "settings",
    "connexion", "dataclasses_json", "flask", "jsonschema", "lxml", "starlette", "werkzeug", "xsdata", "yaml",
]

[[tool.importlinter.contracts]]
id = "core-layers"
name = "Inside core: flows -> ports -> model, capabilities -> result"
type = "layers"
containers = ["core"]
layers = ["flows", "ports", "model | capabilities", "result"]

[[tool.importlinter.contracts]]
id = "core-model-objects"
name = "The object packages of core.model are independent, except domain -> contact and organisation -> contact"
type = "independence"
modules = [
    "core.model.contact", "core.model.domain", "core.model.host", "core.model.message", "core.model.organisation",
]
ignore_imports = ["core.model.domain.** -> core.model.contact.**", "core.model.organisation.** -> core.model.contact.**"]

[[tool.importlinter.contracts]]
id = "core-model-shared"
name = "core.model.shared imports no object package of core.model"
type = "forbidden"
source_modules = ["core.model.shared"]
forbidden_modules = [
    "core.model.contact", "core.model.domain", "core.model.host", "core.model.message", "core.model.organisation",
]

[[tool.importlinter.contracts]]
id = "rpp-not-registry-adapter"
name = "rpp imports core only, never registry_adapter, api_docs, XML or settings"
type = "forbidden"
source_modules = ["rpp"]
forbidden_modules = ["api_docs", "main", "registry_adapter", "settings", "lxml", "xsdata"]

[[tool.importlinter.contracts]]
id = "rpp-layers"
name = "Inside rpp: handlers -> mapping, http; mapping -> dto, schema"
type = "layers"
containers = ["rpp"]
layers = ["handlers", "mapping | http", "dto | schema"]

[[tool.importlinter.contracts]]
id = "rpp-mapping-no-http"
name = "rpp.mapping never imports rpp.http, Flask or Connexion"
type = "forbidden"
source_modules = ["rpp.mapping", "rpp.dto", "rpp.schema"]
forbidden_modules = ["rpp.handlers", "rpp.http", "connexion", "flask", "starlette", "werkzeug"]

# The OpenAPI documents and the UI over them are served by api_docs in front of the rpp app (#205): it takes the documents as
# plain dicts (main hands them over) and knows nothing of RPP, of the backends or of Connexion.
[[tool.importlinter.contracts]]
id = "api-docs-standalone"
name = "api_docs imports no other package of the proxy and no web framework but Starlette"
type = "forbidden"
source_modules = ["api_docs"]
forbidden_modules = [
    "core", "extensions", "main", "registration", "registry_adapter", "rpp", "settings",
    "connexion", "flask", "werkzeug",
]

[[tool.importlinter.contracts]]
id = "registry-adapter-not-rpp"
name = "registry_adapter never imports rpp, core.flows, core.session, settings or a web framework"
type = "forbidden"
source_modules = ["registry_adapter"]
forbidden_modules = ["api_docs", "core.flows", "core.session", "main", "rpp", "settings", "connexion", "dataclasses_json", "flask", "jsonschema", "starlette", "werkzeug"]

[[tool.importlinter.contracts]]
id = "epp-layers"
name = "Inside epp: gateways -> commands -> xml, session"
type = "layers"
containers = ["registry_adapter.epp"]
layers = ["gateways", "commands", "xml | session"]

[[tool.importlinter.contracts]]
id = "epp-only-session-sends"
name = "Inside epp only session uses the transport"
type = "forbidden"
source_modules = [
    "registry_adapter.epp.commands", "registry_adapter.epp.gateways", "registry_adapter.epp.xml",
    "registry_adapter.epp.contact_refusal", "registry_adapter.epp.refusals",
]
forbidden_modules = ["registry_adapter.common.transport"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "registry-adapter-common-standalone"
name = "registry_adapter.common imports no project package"
type = "forbidden"
source_modules = ["registry_adapter.common"]
forbidden_modules = ["core", "main", "registry_adapter.epp", "registry_adapter.rri", "rpp", "settings"]

[[tool.importlinter.contracts]]
id = "settings-standalone"
name = "settings imports no project package, and only main imports settings"
type = "forbidden"
source_modules = ["settings"]
forbidden_modules = ["api_docs", "core", "main", "registry_adapter", "rpp"]

[[tool.importlinter.contracts]]
id = "protocols-independent"
name = "The protocol adapters never import each other"
type = "independence"
modules = ["registry_adapter.epp", "registry_adapter.rri", "registry_adapter.sqlite"]

[[tool.importlinter.contracts]]
id = "rri-layers"
name = "Inside rri: gateways -> commands -> session -> xml (the session logs in and reads replies in XML)"
type = "layers"
containers = ["registry_adapter.rri"]
layers = ["gateways", "commands", "session", "xml"]

[[tool.importlinter.contracts]]
id = "rri-only-session-sends"
name = "Inside rri only session uses the transport"
type = "forbidden"
source_modules = [
    "registry_adapter.rri.commands", "registry_adapter.rri.gateways", "registry_adapter.rri.xml",
    "registry_adapter.rri.result_codes", "registry_adapter.rri.statuses", "registry_adapter.rri.extensions",
]
forbidden_modules = ["registry_adapter.common.transport"]
allow_indirect_imports = true

# The extensions registered by configuration (#177): the generic code does not know any, and each has its own tree.
[[tool.importlinter.contracts]]
id = "registration-standalone"
name = "registration imports no other package of the proxy"
type = "forbidden"
source_modules = ["registration"]
forbidden_modules = ["api_docs", "core", "extensions", "main", "registry_adapter", "rpp", "settings"]

[[tool.importlinter.contracts]]
id = "generic-not-extensions"
name = "No generic package imports an extension"
type = "forbidden"
source_modules = [
    "api_docs", "core", "registration", "rpp", "settings", "registry_adapter.common", "registry_adapter.epp",
    "registry_adapter.rri.commands", "registry_adapter.rri.extension_part", "registry_adapter.rri.gateways",
    "registry_adapter.rri.message_type",
    "registry_adapter.rri.result_codes", "registry_adapter.rri.session", "registry_adapter.rri.statuses",
    "registry_adapter.rri.xml",
    "registry_adapter.sqlite.client_directory", "registry_adapter.sqlite.clock", "registry_adapter.sqlite.common_part",
    "registry_adapter.sqlite.extension_part", "registry_adapter.sqlite.gateways", "registry_adapter.sqlite.hash_password",
    "registry_adapter.sqlite.member_hook", "registry_adapter.sqlite.member_refused", "registry_adapter.sqlite.message_store",
    "registry_adapter.sqlite.migrations", "registry_adapter.sqlite.models", "registry_adapter.sqlite.password_hash",
    "registry_adapter.sqlite.schema_version_row", "registry_adapter.sqlite.sqlite_backend",
    "registry_adapter.sqlite.sqlite_context", "registry_adapter.sqlite.sqlite_database",
    "registry_adapter.sqlite.sqlite_part",
]
forbidden_modules = ["extensions"]

[[tool.importlinter.contracts]]
id = "extension-layers"
name = "Inside an extension: the registration -> rpp -> core"
type = "layers"
containers = ["extensions.planets"]
layers = ["register_planets", "rpp", "core"]

[[tool.importlinter.contracts]]
id = "extension-layers-rri"
name = "Inside the rri extension: the registration -> rpp -> core"
type = "layers"
containers = ["extensions.rri"]
layers = ["register_rri", "rpp", "core"]

[[tool.importlinter.contracts]]
id = "extension-layers-members"
name = "Inside an extension that adds members: the registration -> rpp -> core"
type = "layers"
containers = ["extensions.planet_atmosphere"]
layers = ["register_planet_atmosphere", "rpp", "core"]

[[tool.importlinter.contracts]]
id = "extension-layers-members-orbit"
name = "Inside the satellite orbit extension: the registration -> rpp -> core"
type = "layers"
containers = ["extensions.satellite_orbit"]
layers = ["register_satellite_orbit", "rpp", "core"]

[[tool.importlinter.contracts]]
id = "extension-rpp-layers-members"
name = "Inside the rpp of an extension that adds members: mapping -> dto, schema"
type = "layers"
containers = ["extensions.planet_atmosphere.rpp", "extensions.satellite_orbit.rpp"]
layers = ["mapping", "dto | schema"]

[[tool.importlinter.contracts]]
id = "extension-rpp-layers"
name = "Inside the rpp of an extension: handlers -> mapping -> dto, schema"
type = "layers"
containers = ["extensions.planets.rpp", "extensions.rri.rpp"]
layers = ["handlers", "mapping", "dto | schema"]

[[tool.importlinter.contracts]]
id = "extension-core-layers"
name = "Inside the core of an extension: flows -> ports -> model"
type = "layers"
containers = ["extensions.planets.core", "extensions.rri.core"]
layers = ["flows", "ports", "model"]

[[tool.importlinter.contracts]]
id = "extension-core-pure"
name = "The core of an extension imports the core of the proxy and the standard library only"
type = "forbidden"
source_modules = [
    "extensions.planets.core", "extensions.planet_atmosphere.core", "extensions.satellite_orbit.core", "extensions.rri.core",
]
forbidden_modules = [
    "api_docs", "main", "registration", "registry_adapter", "rpp", "settings", "extensions.planets.rpp",
    "extensions.planet_atmosphere.rpp", "extensions.satellite_orbit.rpp", "extensions.rri.rpp", "sqlalchemy",
    "connexion", "dataclasses_json", "flask", "jsonschema", "lxml", "starlette", "werkzeug", "xsdata", "yaml",
]

[[tool.importlinter.contracts]]
id = "extension-not-adapter"
name = "An extension imports no registry adapter, settings or XML"
type = "forbidden"
source_modules = ["extensions"]
forbidden_modules = ["main", "registry_adapter", "settings", "lxml", "sqlalchemy", "xsdata"]

[[tool.importlinter.contracts]]
id = "sqlite-extensions-core-only"
name = "The SQLite part of an extension imports the core of an extension only, of the extensions only what it needs"
type = "forbidden"
source_modules = ["registry_adapter.sqlite.extensions"]
forbidden_modules = [
    "extensions.*.rpp", "extensions.*.core.flows", "extensions.planets.register_planets", "extensions.rri.register_rri",
    "extensions.planet_atmosphere.register_planet_atmosphere", "extensions.satellite_orbit.register_satellite_orbit", "rpp", "core.flows",
    "core.session", "registration", "settings",
]

[[tool.importlinter.contracts]]
id = "rri-common-not-extensions"
name = "The common part of the RRI backend does not import the part of an extension, which it loads by name"
type = "forbidden"
source_modules = [
    "registry_adapter.rri.commands", "registry_adapter.rri.extension_part", "registry_adapter.rri.gateways",
    "registry_adapter.rri.message_type",
    "registry_adapter.rri.result_codes", "registry_adapter.rri.session", "registry_adapter.rri.statuses",
    "registry_adapter.rri.xml",
]
forbidden_modules = ["registry_adapter.rri.extensions"]

[[tool.importlinter.contracts]]
id = "rri-extensions-core-only"
name = "The RRI part of an extension imports the core of an extension only, of the extensions only what it needs"
type = "forbidden"
source_modules = ["registry_adapter.rri.extensions"]
forbidden_modules = [
    "extensions.*.rpp", "extensions.*.core.flows", "extensions.rri.register_rri", "rpp", "core.flows", "core.session",
    "registration", "settings",
]

[[tool.importlinter.contracts]]
id = "sqlite-common-not-extensions"
name = "The common part of the SQLite backend does not import the part of an extension, which it loads by name"
type = "forbidden"
source_modules = [
    "registry_adapter.sqlite.client_directory", "registry_adapter.sqlite.clock", "registry_adapter.sqlite.common_part",
    "registry_adapter.sqlite.extension_part", "registry_adapter.sqlite.gateways", "registry_adapter.sqlite.hash_password",
    "registry_adapter.sqlite.member_hook", "registry_adapter.sqlite.member_refused", "registry_adapter.sqlite.message_store",
    "registry_adapter.sqlite.migrations", "registry_adapter.sqlite.models", "registry_adapter.sqlite.password_hash",
    "registry_adapter.sqlite.schema_version_row", "registry_adapter.sqlite.sqlite_backend",
    "registry_adapter.sqlite.sqlite_context", "registry_adapter.sqlite.sqlite_database",
    "registry_adapter.sqlite.sqlite_part",
]
forbidden_modules = ["registry_adapter.sqlite.extensions"]

[[tool.importlinter.contracts]]
id = "sqlite-not-xml"
name = "The SQLite backend has no XML, no transport and no protocol of the registries"
type = "forbidden"
source_modules = ["registry_adapter.sqlite"]
forbidden_modules = ["registry_adapter.common.transport", "registry_adapter.epp", "registry_adapter.rri", "lxml", "xsdata"]
