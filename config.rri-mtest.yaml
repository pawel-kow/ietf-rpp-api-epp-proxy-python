# The proxy in front of DENIC's RRI test environment (MTEST), for the integration suite (RPP_TEST_ENV=rri-mtest).
# The credentials are the clients' own: HTTP Basic is passed through as the RRI LOGIN.
rpp_backend: rri
rpp_rri_host: rri.test.denic.de
rpp_rri_port: 51131
rpp_rri_use_tls: true
rpp_rri_tls_insecure_skip_verify: false
#rpp_rri_lgr: null      # the one LGR name a client may give for DENIC's IDN repertoire (gap Q11)

# What the discovery document states (placeholders for the test deployment).
rpp_base_url: https://localhost:8000
rpp_tlds:
  - de
rpp_environment_name: rpp-rri-proxy.example
rpp_environment_status: test
