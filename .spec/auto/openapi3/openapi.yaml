components:
  parameters:
    gen.IncludeElements:
      name: includeElements
      in: query
      required: false
      schema:
        type: string
      explode: false
    gen.domainName.availability.parameters.lgr:
      name: lgr
      in: query
      required: false
      schema:
        type: string
      explode: false
    gen.domainName.availability.parameters.uName:
      name: uName
      in: query
      required: false
      schema:
        type: string
      explode: false
    gen.domainName.read.parameters.hostsFilter:
      name: hostsFilter
      in: query
      required: false
      schema:
        type: string
      explode: false
    gen.message.query.parameters.type:
      name: type
      in: query
      required: false
      schema:
        type: string
      explode: false
    protocol.PublicRequestHeaders.accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
    protocol.PublicRequestHeaders.acceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
    protocol.PublicRequestHeaders.rppCltrid:
      name: RPP-Cltrid
      in: header
      required: true
      schema:
        type: string
    protocol.RequestHeaders.accept:
      name: Accept
      in: header
      required: true
      description: An RPP media type with a version parameter, for example `application/rpp+json; version=1.0`.
      schema:
        type: string
    protocol.RequestHeaders.acceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
    protocol.RequestHeaders.rppAuthorization:
      name: RPP-Authorization
      in: header
      required: false
      description: 'Object authorisation: `authinfo value=<base64>, roid=<roid>`, roid being optional.'
      schema:
        type: string
    protocol.RequestHeaders.rppCltrid:
      name: RPP-Cltrid
      in: header
      required: true
      description: 'Client transaction identifier: idempotency key and audit-trail reference. Unique per request.'
      schema:
        type: string
    protocol.RequestHeaders.rppProfile:
      name: RPP-Profile
      in: header
      required: false
      description: Profile and its version. Optional here because the working group has not chosen between this header and media type parameters (§14).
      schema:
        type: string
  schemas:
    external.jscontact.Address:
      type: object
      properties:
        full:
          type: string
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: A two-character ISO 3166-1 alpha-2 country code, when present.
        components:
          type: array
          items:
            $ref: '#/components/schemas/external.jscontact.AddressComponent'
      description: A postal address for the Card's entity.
    external.jscontact.AddressComponent:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          $ref: '#/components/schemas/external.jscontact.AddressComponentKind'
        value:
          type: string
      description: A single component of a Card's address, such as locality or postcode.
    external.jscontact.AddressComponentKind:
      type: string
      enum:
        - name
        - locality
        - region
        - postcode
        - country
      description: Kind of an address component.
    external.jscontact.Card:
      type: object
      required:
        - '@type'
        - version
      properties:
        '@type':
          type: string
          enum:
            - Card
        version:
          type: string
          enum:
            - '2.0'
        kind:
          $ref: '#/components/schemas/external.jscontact.CardKind'
        language:
          type: string
        name:
          $ref: '#/components/schemas/external.jscontact.Name'
        organizations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/external.jscontact.Organization'
        addresses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/external.jscontact.Address'
        phones:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/external.jscontact.Phone'
        emails:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/external.jscontact.EmailAddress'
        links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/external.jscontact.Link'
        localizations:
          type: object
          additionalProperties: {}
      description: |-
        JSContact Card object (version 2.0), per the RPP JSContact Profile
        (draft-wullink-rpp-json §5.2.8).
    external.jscontact.CardKind:
      type: string
      enum:
        - individual
