# Value limits of the registries the integration suite runs against.
#
# DRAFT. Companion of integration-test-review.md (§5, §6). Each entry is one limit of one RPP data
# element: what the RPP drafts say about it (`rpp`) and what each backend enforces. Most backend values
# come from the server's source, its database or the registry's documentation, not from a test run:
# `probe` names the integration cases under tests/integration/test_case_data/ that confirm each one, and
# `verified` says per backend how they came out.
#
# Shape of an entry:
#   path:        JSON pointer of the element inside the RPP object ("*" for any array member)
#   kind:        length | count | range | charset | pattern | enum | format | presence | mutability
#   rpp:         {defined: true|false, ...} what the drafts state; `gap` says what is missing
#   <backend>:   min / max / pattern / values / rule, plus
#                  over:     the registry's answer to a value over the limit (result code, or `truncates`)
#                  expected: the RPP answer the proxy should give (HTTP status and RPP-Code)
#                  source:   code | db | doc | xsd | observed | inferred, and `ref`
#   probe:       the case ids under tests/integration/test_case_data/
#   verified:    per backend: passed; defect <issue> (the case is skipped or does not run there because of it);
#                pending (not run yet); not run: <why>; n/a (no probe runs there)
#
# Backends:
#   epp-docker: the XPanel-based EPP test server of EPP-server-docker (tests/integration/environments/
#               epp-docker.yaml). MariaDB 10.1 with sql_mode NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION, so
#               without STRICT_*: a value longer than its column is cut and stored, not refused
#               (pawel-kow/epp#21). Source paths are inside the epp-server container, under
#               /var/www/cgi-bin/epp/.
#   rri-mtest:  DENIC RRI 5.0, MTEST (tests/integration/environments/rri-mtest.yaml). Source is
#               docs/rri/rri-5.0-reference.md (§ given) and docs/rri/xsd/. An RRI XSD failure is
#               83000000004 and a class-5 code is a temporary error; the proxy maps both to 500 02400
#               (src/registry_adapter/rri/result_codes.py), so a client value over an RRI limit may
#               come back as 500 instead of 4xx. `expected` states what it should be.

schema: rpp-backend-limits/0.1
status: draft
generated: 2026-11-12
updated: 2026-11-14

backends:
  epp-docker:
    environment: tests/integration/environments/epp-docker.yaml
    tld: example
  rri-mtest:
    environment: tests/integration/environments/rri-mtest.yaml
    tld: de

transport:
  - kind: length
    what: request size
    rpp: {defined: false, gap: "no maximum request size and no result code for one"}
    epp-docker: {max: null, source: inferred, ref: "Apache default, not limited by the server"}
    rri-mtest: {max: 65536, unit: bytes, over: 83000000000, expected: "413 or 400", source: doc, ref: "§2.2"}
    probe: []
    verified: {epp-docker: "n/a", rri-mtest: "n/a"}

domainName:
  - path: /name
    kind: length
    what: length of one label
    rpp: {defined: true, max: 63, unit: octets, ref: "FQDN (data-objects §2.1.11) → RFC 9499, RFC 1035 §2.3.4"}
    epp-docker: {min: 2, max: 63, over: 2005, expected: "400 02005", source: code, ref: "command/command-create.cgi validate_label"}
    rri-mtest: {min: 1, max: 63, over: 53300062003, expected: "400 02005", source: xsd, ref: "domainace-rule [0-9a-zA-Z][0-9a-zA-Z-]{0,62}"}
    probe: [limits_domain/test3-label_of_63, limits_domain/test4-label_of_64]
    verified: {epp-docker: "defect #138, defect pawel-kow/epp#30", rri-mtest: "passed except defect #138"}
  - path: /name
    kind: length
    what: length of the whole name
    rpp: {defined: true, max: 253, unit: "characters (255 octets on the wire)", ref: "RFC 1035 §2.3.4", note: "a second-level name is bounded first by its 63-octet label"}
    epp-docker:
      max: 68
      over: truncates
      note: "`domain`.`name` is varchar(68): a 61 to 63 character label plus .EXAMPLE passes validate_label and is cut by the database. Suspected defect of the test server."
      expected: "422 02306, or 201 that reads back the full name"
      source: db
      ref: "registry.domain.name varchar(68)"
    rri-mtest: {min: 4, max: 66, unit: characters incl. ".de", source: doc, ref: "§3.6 domain-rule"}
    probe: [limits_domain/test3-label_of_63, limits_domain/test1-label_of_60]
    verified: {epp-docker: "passed except defect pawel-kow/epp#30", rri-mtest: "passed"}
  - path: /name
    kind: charset
    rpp: {defined: partly, rule: "A-label for an IDN; servers MAY restrict to their TLDs", gap: "no rule on '_', '--' in positions 3-4 of a non-IDN label, leading or trailing '-', upper case input, trailing dot"}
    epp-docker: {pattern: "^[A-Z0-9-]+$ per label, no leading/trailing '-', no '--' outside xn--", over: 2005, source: code, ref: "validate_label"}
    rri-mtest: {pattern: "latinToken (Basic Latin, Latin-1 Supplement, Latin Extended-A) for the U-label", source: doc, ref: "§5.2"}
    probe: [limits_domain/test5-leading_hyphen, limits_domain/test6-underscore, limits_domain/test7-hyphens_in_3_and_4, limits_domain/test10-upper_case_name, limits_domain/test8-trailing_dot, limits_domain/test9-other_tld]
    verified: {epp-docker: "passed", rri-mtest: "passed"}
  - path: /uName
    kind: charset
    rpp: {defined: true, rule: "NFC, IDNA2008 PVALID, Bidi rule, round trip to the A-label (data-objects §9 domainName)"}
    epp-docker: {rule: "code points of the IDN table the lgr maps to (de, es)", over: 2306, source: observed, ref: "domain_create/test29"}
    rri-mtest: {rule: "DENIC repertoire, holds ñ", source: doc}
    probe: [domain_create/test29-code_point_outside_idn_table, limits_domain/test11-uname_not_nfc]
    verified: {epp-docker: "passed", rri-mtest: "passed"}
  - path: /lgr
    kind: enum
    rpp: {defined: true, rule: "name registered in the IANA IDN Tables registry"}
    epp-docker: {values: [latn-1.0], source: code, ref: "config.yaml rpp_idn_lgr_tables"}
    rri-mtest: {values: [latn-1.0], source: code, ref: "config.rri-mtest.yaml rpp_rri_lgr"}
    probe: [domain_create/test28-lgr_without_idn_table]
    verified: {epp-docker: "passed", rri-mtest: "passed"}

  - path: /status
    kind: count
    rpp: {defined: false, gap: "no maximum, no rule for a repeated label"}
    epp-docker: {max: null, note: "one row per status, client values clientDeleteProhibited, clientHold, clientRenewProhibited, clientTransferProhibited, clientUpdateProhibited", source: db}
    rri-mtest: {client_values: [], note: "every status is the registry's", source: code, ref: "RRI_PROFILE.client_statuses=False"}
    probe: [limits_domain/test12-all_client_statuses, limits_domain/test13-status_twice]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}
  - path: /status/*/reason
    kind: length
    rpp: {defined: false}
    epp-docker: {max: 0, note: "not stored, Info repeats the label (#54)", source: db}
    rri-mtest: {max: 0, source: inferred}
    probe: []
    verified: {epp-docker: "n/a", rri-mtest: "n/a"}

  - path: /registrant
    kind: count
    rpp: {defined: true, min: 0, max: 1, gap: "several holders (RRI) are contacts labelled registrant, gap Q1"}
    epp-docker: {min: 0, max: 1, source: code, ref: "EPP_PROFILE.max_registrants"}
    rri-mtest: {min: 1, max: 5, rule: "all different", over: "XSD (contact 1-7) 83000000004", expected: "422 02306", note: "the proxy answers a 6th holder 501 02102 before RRI sees it (#140)", source: doc, ref: "§5.2 Holder"}
    probe: [limits_domain/test14-five_registrants, limits_domain/test15-six_registrants, limits_domain/test16-same_registrant_twice]
    verified: {epp-docker: "n/a", rri-mtest: "passed except defect #140"}
  - path: /contacts
    kind: count
    what: per label
    rpp: {defined: false, rule: "Maximum number of associated contacts (per role) MAY be restricted by server policy", gap: "no discovery, no result code"}
    epp-docker:
      labels: {admin: {max: 5}, billing: {max: 5}, tech: {max: 5}}
      over: 2306
      note: "checked on create only; command-update.cgi does not count, so adds beyond 5 may pass"
      expected: "422 02306"
      source: code
      ref: "command-create.cgi contact_admin_list->size() > 5"
    rri-mtest:
      labels: {generalRequest: {max: 1}, abuse: {max: 1}}
      over: "XSD 83000000004"
      expected: "422 02306"
      source: doc
      ref: "§5.2 GeneralRequest, AbuseContact"
    duplicate: {rpp: "open", epp-docker: "no reply to a contact named twice in a role (pawel-kow/epp#32)"}
    probe: [limits_domain/test17-five_tech_contacts, limits_domain/test18-six_tech_contacts, limits_domain/test19-sixth_tech_contact_by_update, limits_domain/test20-second_abuse_contact, limits_domain/test55-same_tech_contact_twice]
    verified: {epp-docker: "passed except defects pawel-kow/epp#29, pawel-kow/epp#32", rri-mtest: "not run: test20 needs two different REQUEST handles, MTEST has one"}
  - path: /contacts/*/label
    kind: enum
    rpp: {defined: false, gap: "open string, spec-issues.md Contact labels"}
    epp-docker: {values: [admin, billing, tech], source: code}
    rri-mtest: {values: [generalRequest, abuse], source: code}
    probe: [limits_domain/test21-unknown_contact_label]
    verified: {epp-docker: "passed", rri-mtest: "passed"}

  - path: /nameservers
    kind: count
    rpp: {defined: false, gap: "no minimum or maximum"}
    epp-docker:
      min: 0
      max: 13
      over: 2306
      note: "checked per command: an update adding 13 to a domain that has some is not refused"
      expected: "422 02306"
      source: code
      ref: "command-create.cgi hostObj_list->size() > 13, command-update.cgi same on the add list"
    rri-mtest: {note: "no host objects: nameservers answer 501 02102 (domain_lifecycle/test6); see /dns/records ns", source: code}
    duplicate: {rpp: "open", epp-docker: "2302 Duplicate nameserver, 409 02302"}
    probe: [limits_domain/test22-thirteen_nameservers, limits_domain/test23-fourteen_nameservers, limits_domain/test24-fourteenth_nameserver_by_update, limits_domain/test56-same_nameserver_twice]
    verified: {epp-docker: "passed except defect pawel-kow/epp#29", rri-mtest: "n/a"}

  - path: /dns/records
    kind: count
    what: ns records (delegation)
    rpp: {defined: false}
    epp-docker: {max: 13, note: "domain:hostAttr, stored as host objects", over: 2306, source: code}
    rri-mtest: {min: 2, max: 13, over: 53300102920, expected: "422 02306", note: "a class-5 code: the proxy answers 500 02400 (#139, seen on MTEST for 1 and 14)", source: doc, ref: "§5.2 Nserver, message 53300102920"}
    duplicate: {rpp: "open", rri-mtest: "taken, 201"}
    update: {rri-mtest: "an update that keeps or adds name servers which do not serve the zone is refused, 53300102912 (class 5, #139)"}
    probe: [limits_domain/test25-one_ns_record, limits_domain/test26-two_ns_records, limits_domain/test27-thirteen_ns_records, limits_domain/test28-fourteen_ns_records, limits_domain/test57-same_ns_record_twice]
    verified: {epp-docker: "n/a", rri-mtest: "passed except defect #139"}
  - path: /dns/records
    kind: count
    what: a, aaaa and mx records of the domain itself (Nsentry)
    rpp: {defined: false}
    epp-docker: {values: [], note: "not supported, 501", source: code, ref: "EPP_PROFILE.domain_record_types"}
    rri-mtest: {min: 1, max: 5, rule: "mx preference 0-999; null MX '.' allowed", note: "the doc's 'an aaaa needs an a' (66300063023) does not hold on MTEST: an aaaa alone is taken (limits_domain/test31)", source: doc, ref: "§5.2 Nsentry"}
    probe: [limits_domain/test29-five_address_records, limits_domain/test30-six_address_records, limits_domain/test31-aaaa_without_a, limits_domain/test32-null_mx_record]
    verified: {epp-docker: "n/a", rri-mtest: "passed"}
  - path: /dns/records
    kind: count
    what: all dnsentry together
    rpp: {defined: false}
    rri-mtest: {max: 20, over: "XSD 83000000004", expected: "422 02306", note: "not reachable: 13 ns and 5 DNSKEY records are 18, and an Nsentry cannot go with a DNSKEY", source: xsd, ref: "domain-5.0.xsd dnsentry 1..20"}
    probe: []
    verified: {epp-docker: "n/a", rri-mtest: "n/a"}
  - path: /dns/records/*/type
    kind: enum
    rpp: {defined: true, rule: "EPP profile: ns, a, aaaa; with DNSSEC ds and/or dnskey"}
    epp-docker: {values: [ns, ds, dnskey], note: "a/aaaa only as glue of ns", source: code}
    rri-mtest: {values: [ns, a, aaaa, mx, dnskey], note: "no ds input, DENIC computes it", source: code}
    probe: [host_create/test9-other_record_type]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}
  - path: /dns/records/*/rdata (ds)
    kind: range
    rpp: {defined: false, gap: "rdata members named, value ranges not (keyTag, algorithm, digestType, digest length)"}
    epp-docker:
      keyTag: {min: 0, max: 65535, over: 2004}
      algorithm: {min: 1, max: 255, over: 2004}
      digestType: {values: [1, 2, 3], note: "4 (SHA-384) refused: digest column varchar(64)", over: 2306}
      digest: {length_by_type: {1: 40, 2: 64, 3: 64}, charset: hex, over: 2306}
      count: {max: null}
      duplicate_digest: {over: 2306, note: "also within one request: 422 02306 (limits_domain/test58)"}
      interface: {note: "key data interface refused 2306 (pawel-kow/epp#20)"}
      source: code
      ref: "lib/EPP/SecDNS.pm _parse_ds_data"
    rri-mtest: {note: "no ds input", source: doc}
    probe: [domain_create/test22-invalid_ds_digest, limits_domain/test33-keytag_65535, limits_domain/test34-keytag_65536, limits_domain/test35-digest_type_4, limits_domain/test36-two_ds_records, limits_domain/test58-same_ds_twice]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}
  - path: /dns/records/*/rdata (dnskey)
    kind: range
    rpp: {defined: false}
    epp-docker: {flags: {min: 0, max: 65535}, protocol: {min: 0, max: 255}, algorithm: {min: 0, max: 255}, publicKey: {max: 255, charset: base64}, note: "only inside dsData; dnskey alone 2306", source: code}
    rri-mtest: {flags: {values: [256, 257]}, protocol: {values: [3]}, algorithm: {values: [3, 5, 6, 7, 8, 10, 12, 13, 14]}, publicKey: {min: 30, max: 999, charset: "A-Za-z0-9-./+", rule: "a valid key of its algorithm, else 66300068807"}, count: {max: 5, over: "66300068807 too many dnskeys", expected: "422 02306", source: observed, note: "the doc names only the 20 dnsentry in all"}, rule: "only with Nserver: a DNSKEY next to an Nsentry is refused with 66300048905 (MTEST)", source: doc, ref: "§3.6 dnskey-rule, §5.2 Dnskey"}
    probe: [limits_domain/test37-dnskey_flags_256, limits_domain/test38-dnskey_algorithm_9, limits_domain/test53-five_dnskeys, limits_domain/test54-six_dnskeys]
    verified: {epp-docker: "n/a", rri-mtest: "passed"}
  - path: /dns/controls
    kind: range
    rpp: {defined: partly, rule: "ttl and maxSigLifetime >= 1", gap: "no maximum"}
    epp-docker: {maxSigLifetime: {min: 1, max: 2147483647, note: "server holds it; the proxy answers 501 02102 for it and 501 02103 for ttl"}, source: code, ref: "SecDNS.pm MAX_SIG_LIFE"}
    rri-mtest: {note: "not supported", source: doc}
    probe: [domain_create/test20-dns_controls_are_unsupported, domain_create/test39-max_sig_lifetime, domain_update/test64-patch_max_sig_lifetime]
    verified: {epp-docker: "passed", rri-mtest: "passed"}

  - path: /authInfo/authdata
    kind: length
    rpp: {defined: false, gap: "no length or character set for method authinfo"}
    epp-docker: {min: 6, max: 16, rule: "at least one upper case letter and one digit", over: 2005, expected: "400 02005", source: code, ref: "command-create.cgi, command-update.cgi authInfo_pw"}
    rri-mtest: {min: 8, max: 16, charset: "A-H J-N P-Z a-k m-n p-z 2-9 + - / *", validity_days: 30, expected: "422 02306 (checked by the proxy, gap Q4)", source: doc, ref: "§6.15"}
    probe: [limits_domain/test39-authinfo_at_minimum, limits_domain/test40-authinfo_under_minimum, limits_domain/test41-authinfo_of_16, limits_domain/test42-authinfo_of_17, limits_domain/test43-authinfo_without_digit, limits_domain/test44-authinfo_with_letter_o]
    verified: {epp-docker: "passed", rri-mtest: "passed"}
  - path: /authInfo/method
    kind: enum
    rpp: {defined: partly, rule: "IANA registry; authinfo in the EPP profile", gap: "registry not yet defined"}
    epp-docker: {values: [authinfo]}
    rri-mtest: {values: [authinfo]}
    probe: [limits_domain/test45-unknown_auth_method]
    verified: {epp-docker: "passed", rri-mtest: "passed"}

  - path: /processes/createProcess/*/period
    kind: range
    rpp: {defined: true, value: {min: 1, max: 99}, unit: [y, m]}
    epp-docker: {rule: "12 to 120 months in steps of 12 (1 to 10 years)", over: 2306, source: code, ref: "command-create.cgi date_add"}
    rri-mtest: {note: "no periods, 501", source: code}
    probe: [limits_domain/test46-period_0, limits_domain/test47-period_100, limits_domain/test48-period_11_months, limits_domain/test49-period_10_years, limits_domain/test50-period_11_years]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}

renewProcess:
  - path: /renewalPeriod
    kind: range
    rpp: {defined: true, value: {min: 1, max: 99}, unit: [y, m]}
    epp-docker: {rule: "12 to 120 months in steps of 12; the new expiry at most 10 years ahead", over: 2306, source: code, ref: "command-renew.cgi"}
    rri-mtest: {note: "no renew, 501", source: code}
    probe: [limits_domain/test51-renew_11_months, limits_domain/test52-renew_past_10_years]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}

restoreProcess:
  - path: /restoreReport/statements
    kind: count
    rpp: {defined: true, min: 1, max: 2, gap: "RFC 3915 needs exactly 2; the EPP profile does not say so"}
    epp-docker: {min: 2, max: 2, source: observed, ref: "domain_restore/test9"}
    rri-mtest: {note: "no report, 501", source: code}
    probe: [domain_restore/test9-report_with_one_statement]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}

contact:
  - path: /id
    kind: length
    rpp: {defined: false, gap: "data-objects §7.1 names no bounds; json §6.1.1 prescribes the roidType pattern ^(\\w|_){1,8}-\\w{1,}$ max 89, which neither EPP contact ids (3-16) nor DENIC handles (DENIC-1000022-EXAMPLE) follow; the proxy schema has none"}
    epp-docker: {min: 3, max: 16, over: 2005, expected: "400 02005", note: "a check of an id outside 3-16 answers available (pawel-kow/epp#24)", source: code, ref: "command-create.cgi validate_clIDType"}
    rri-mtest: {min: 9, max: 32, over: "XSD 83000000004", expected: "400 02005", source: xsd, ref: "contact-5.0.xsd handleType"}
    probe: [limits_contact/test1-id_at_maximum, limits_contact/test2-id_over_maximum]
    verified: {epp-docker: "passed", rri-mtest: "passed except defect #139"}
  - path: /id
    kind: pattern
    rpp: {defined: false}
    epp-docker: {pattern: "^<registrar prefix>-[A-Z0-9-]+$, no '--', no trailing '-'; case-insensitive", over: "2306 for another prefix, 2005 otherwise", source: code}
    rri-mtest: {pattern: "^[dD][eE][nN][iI][cC]-<RegAcc number>-[-.a-zA-Z0-9]+$", over: "63200020603 another RegAcc, XSD otherwise", source: xsd}
    probe: [limits_contact/test3-id_of_another_registrar, limits_contact/test4-id_with_underscore]
    verified: {epp-docker: "passed", rri-mtest: "passed except defect #139"}

  - path: /status
    kind: count
    rpp: {defined: false}
    epp-docker: {client_values: [clientDeleteProhibited, clientTransferProhibited, clientUpdateProhibited], source: db}
    rri-mtest: {client_values: [], note: "ok is synthesised (gap Q14)", source: code}
    duplicate: {rpp: "open", epp-docker: "taken, 200"}
    probe: [limits_contact/test5-all_client_statuses, limits_contact/test27-status_twice]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}

  - path: /contactInfo/name/full
    kind: length
    rpp: {defined: false, gap: "spec-issues.md Length of contact fields"}
    epp-docker: {min: 5, max: 255, over: truncates, note: "int form; pawel-kow/epp#21", source: code, ref: "command-create.cgi postalInfo_int_name {5,}, column varchar(255)"}
    rri-mtest: {min: 3, max: 255, rule: "not digits only, not specials only, not one repeated letter, not 5 identical in a row", immutable: true, source: doc, ref: "§5.1, §6.3"}
    charset: {epp-docker: "an apostrophe and a character outside the BMP are refused, 2005", rri-mtest: "an apostrophe is taken; digits only refused, 63400000001"}
    probe: [limits_contact/test8-name_at_minimum, limits_contact/test9-name_under_minimum, limits_contact/test6-name_of_255, limits_contact/test7-name_of_256, contact_create/test31-apostrophe_in_name_refused, contact_create/test44-apostrophe_in_name_taken, contact_create/test32-name_of_digits_refused, contact_create/test45-name_of_digits_taken, contact_create/test41-localized_name_outside_bmp]
    verified: {epp-docker: "passed except defect pawel-kow/epp#21", rri-mtest: "passed except defect #139"}
  - path: /contactInfo/name/full
    kind: charset
    rpp: {defined: true, rule: "US-ASCII in the internationalized form; any character in a localization"}
    epp-docker: {int: "[a-zA-Z0-9-&,./ ] and white space; not starting with '-', ',' or '.'; no '--', ',,', '..'", loc: "letters, marks, digits, -&,./ and white space; BMP only", source: code, ref: "command-create.cgi, lib/EPP/PostalInfo.pm LOC_TEXT"}
    rri-mtest: {rule: "UTF-8, one form only", source: doc}
    probe: [contact_create/test19-non_ascii_name]
    verified: {epp-docker: "passed", rri-mtest: "passed"}
  - path: /contactInfo/organizations/org/name
    kind: length
    rpp: {defined: false}
    epp-docker: {min: 5, max: 255, charset: "as name", over: truncates, source: code}
    rri-mtest: {min: 1, max: 255, rule: "PERSON only; an ORG is named by its name", source: doc}
    probe: []
    verified: {epp-docker: "n/a", rri-mtest: "n/a"}
  - path: /contactInfo/addresses/addr/components (kind name)
    kind: count
    rpp: {defined: partly, rule: "server MAY constrain the number of street lines; order is significant"}
    epp-docker: {min: 0, max: 3, over: "the proxy answers 501 02102; the server itself ignores lines after the third", source: code}
    rri-mtest: {min: 1, max: null, source: doc, ref: "§5.1 Address 1-n"}
    probe: [contact_create/test3-create_all_data, limits_contact/test11-no_street_line, limits_contact/test10-four_street_lines]
    verified: {epp-docker: "passed", rri-mtest: "passed except defect #139"}
