host:
  - path: /hostName
    kind: length
    rpp: {defined: true, label: {max: 63}, total: {max: 253}, ref: "FQDN → RFC 1035 §2.3.4"}
    epp-docker: {label: {max: 63}, total: {max: 253}, pattern: "^([A-Z0-9]([A-Z0-9-]{0,61}[A-Z0-9])?\\.){1,125}[A-Z0-9]([A-Z0-9-]{0,61}[A-Z0-9])$", over: 2005, source: code}
    rri-mtest: {note: "no host objects; a name server host 1-254 characters (nserver-rule)", source: doc}
    probe: [limits_host/test1-label_of_63, limits_host/test2-label_of_64, limits_host/test3-name_of_253, limits_host/test4-name_of_254, host_create/test13-upper_case_name, host_create/test14-underscore_in_name]
    verified: {epp-docker: "passed", rri-mtest: "n/a"}
  - path: /dns/records (a, aaaa)
    kind: count
    rpp: {defined: false}
