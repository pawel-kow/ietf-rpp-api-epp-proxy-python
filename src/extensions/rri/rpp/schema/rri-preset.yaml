  - {id: "io.github.pawel-kow.rpp.messages", version: "0.1.0"}
  - {id: "io.github.pawel-kow.rpp.domain-lock", version: "0.1.0"}
  - {id: "io.github.pawel-kow.rpp.registry-changes", version: "0.1.0"}
profiles: []
