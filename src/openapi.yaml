components:
  parameters:
    headers.RequestHeaders.Prefer:
      name: prefer
      in: header
      required: false
      description: Prefer header to indicate the desired representation of the response.
      schema:
        $ref: '#/components/schemas/headers.PreferHeaderRepresentation'
        default: return=minimal
    headers.RequestHeaders.RPP-Authorization:
      name: rpp-authorization
      in: header
      required: false
      description: RPP-Authorization header must be in the format 'AuthInfo AuthInfo=[authinfo]; Roid=[roid]' (Roid optional) or just '[method] [authinfo]'
      schema:
        type: string
        pattern: ^(AuthInfo AuthInfo=([a-zA-Z0-9=]+)(?:;\s*Roid=(\S+))?)$|(.+\s+.*)
    headers.RequestHeadersMinimal:
      name: rpp-cltrid
      in: header
      required: false
      description: RPP-Cltrid header is used to identify the client request. It MUST be a unique identifier for each request.
      schema:
        type: string
  schemas:
    common.AuthInfo:
      type: object
      properties:
        pw:
          type: string
    common.CheckResponse:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
          description: The status of the check operation, indicating whether the entity is available or not.
    common.ProvisioningObj:
      type: object
      properties:
        status:
          type: array
          items:
            type: string
        upDate:
          type: string
        trDate:
          type: string
        clID:
          type: string
        crID:
          type: string
      allOf:
        - $ref: '#/components/schemas/common.ProvisioningObjMinimal'
    common.ProvisioningObjMinimal:
      type: object
      properties:
        crDate:
          type: string
        exDate:
          type: string
    common.TransferAck:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Reason for the transfer approval, if applicable.
      description: Parameters specific to the transfer of a domain.
    common.TransferNack:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Reason for the transfer approval, if applicable.
      description: Parameters specific to the transfer of a domain.
    common.TransferStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
        - completed
    common.TransferableProvisioninigObj:
      type: object
      required:
        - authInfo
      properties:
        authInfo:
          $ref: '#/components/schemas/common.AuthInfo'
      allOf:
        - $ref: '#/components/schemas/common.ProvisioningObj'
    contact.Contact:
      type: object
      required:
        - id
        - contactType
        - authInfo
      properties:
        id:
          type: string
        name:
          type: string
        organisationName:
          type: string
        contactType:
          $ref: '#/components/schemas/contact.ContactType'
        email:
          type: array
          items:
            type: string
        phone:
          type: array
          items:
            type: string
        fax:
          type: array
          items:
            type: string
        address:
          type: object
          properties:
            street:
              type: array
              items:
                type: string
            city:
              type: string
            stateProvince:
              type: string
            postalCode:
              type: string
            country:
              type: string
        authInfo:
          $ref: '#/components/schemas/common.AuthInfo'
        status:
          type: array
          items:
            type: string
        upDate:
          type: string
        trDate:
          type: string
        clID:
          type: string
        crID:
          type: string
        crDate:
          type: string
        exDate:
          type: string
    contact.ContactCreate:
      type: object
      required:
        - id
        - contactType
        - authInfo
      properties:
        id:
          type: string
        name:
          type: string
        organisationName:
          type: string
        contactType:
          $ref: '#/components/schemas/contact.ContactType'
        email:
          type: array
          items:
            type: string
        phone:
          type: array
          items:
            type: string
        fax:
          type: array
          items:
            type: string
        address:
          type: object
          properties:
            street:
              type: array
              items:
                type: string
            city:
              type: string
            stateProvince:
              type: string
            postalCode:
              type: string
            country:
              type: string
        authInfo:
          $ref: '#/components/schemas/common.AuthInfo'
    contact.ContactDeletion:
      type: object
    contact.ContactTransfer:
      type: object
      properties:
        autoAckDate:
          type: string
          format: date-time
          description: The date on which the transfer will be automatically proceeding if not approved or rejected earlier.
        autoNackDate:
          type: string
          format: date-time
          description: The date on which the transfer will be automatically cancelled if not approved or rejected earlier.
        status:
          allOf:
            - $ref: '#/components/schemas/common.TransferStatus'
          description: The current status of the transfer process, indicating its state.
      description: Parameters specific to the transfer of a domain.
    contact.ContactType:
      type: string
      enum:
        - PERSON
        - ORG
    discovery.HelloResponse:
      type: object
      required:
        - svID
        - svDate
        - svcMenu
        - dcp
      properties:
        svID:
          type: string
        svDate:
          type: string
        svcMenu:
          type: object
          properties:
            version:
              type: string
            lang:
              type: array
              items:
                type: string
          required:
            - version
            - lang
        dcp:
          type: object
          properties:
            access:
              type: object
              properties:
                all:
                  type: string
              required:
                - all
            statement:
              type: object
              properties:
                purpose:
                  type: object
                  properties:
                    admin:
                      type: string
                    prov:
                      type: string
                  required:
                    - admin
                    - prov
                recipient:
                  type: object
                  properties:
                    ours:
                      type: string
                    public:
                      type: string
                  required:
                    - ours
                    - public
                retention:
                  type: object
                  properties:
                    stated:
                      type: string
                  required:
                    - stated
              required:
                - purpose
                - recipient
                - retention
          required:
            - access
            - statement
    domain.ContactReference:
      type: object
      required:
        - value
        - type
      properties:
        value:
          type: string
          description: The unique identifier for the contact, typically a handle or ID.
        type:
          type: array
          items:
            $ref: '#/components/schemas/domain.ContactType'
          description: An array of roles that the contact fulfills for the domain.
      description: Represents a reference to a contact, specifying its identifier and roles.
    domain.ContactType:
      type: string
      enum:
        - registrant
        - admin
        - tech
        - billing
      description: Enumeration of contact types for a domain registration.
    domain.DnsSec:
      type: object
      required:
        - keyTag
        - algorithm
        - digestType
        - digest
      properties:
        keyTag:
          type: string
          description: The key tag value of the DS record, as specified in RFC 4034.
        algorithm:
          type: string
          description: The algorithm used to create the DS record, as specified in RFC 4034.
        digestType:
          type: string
          description: The digest type of the DS record, as specified in RFC 4034.
        digest:
          type: string
          description: The digest value of the DS record in hexadecimal format.
      description: Represents the DNSSEC data for a domain, used to secure DNS lookups.
    domain.Domain:
      type: object
      required:
        - name
        - authInfo
      properties:
        name:
          type: string
          description: The fully qualified name of the domain.
        processes:
          type: object
          properties:
            creation:
              allOf:
                - $ref: '#/components/schemas/domain.DomainCreation'
              description: Parameters for the domain creation process.
            renewal:
              allOf:
                - $ref: '#/components/schemas/domain.DomainRenewal'
              description: Parameters for the domain renewal process.
            transfer:
              allOf:
                - $ref: '#/components/schemas/domain.DomainTransfer'
              description: Parameters for the domain transfer process.
          description: A container for parameters related to specific domain life-cycle processes.
        ns:
          anyOf:
            - $ref: '#/components/schemas/host.DomainEPPHostAttr'
            - $ref: '#/components/schemas/host.DomainHostObj'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/domain.ContactReference'
          description: An array of contacts associated with the domain, each with one or more roles.
        dnsSEC:
          type: array
          items:
            $ref: '#/components/schemas/domain.DnsSec'
          description: An array of DNSSEC data associated with the domain. This is required to sign the domain in DNS.
        authInfo:
          $ref: '#/components/schemas/common.AuthInfo'
        status:
          type: array
          items:
            type: string
        upDate:
          type: string
        trDate:
          type: string
        clID:
          type: string
        crID:
          type: string
        crDate:
          type: string
        exDate:
          type: string
      description: The core model representing a domain name and its associated properties and operations, as defined in RFC 5731.
      example:
        name: example.com
        processes:
          creation:
            period: P2Y
        authInfo:
          pw: password
        contacts:
          - value: registrant-id
            type:
              - registrant
    domain.DomainCreate:
      type: object
