# hostname of the backend EPP server to use
# the compose service name of the test backend, which resolves on its <project>_epp_net
# docker network once the devcontainer is attached to it (see docs/agents/testing.project.md)
rpp_epp_host: epp-server

# optional settings
# container-internal EPP TLS port (published on the docker host as 7043, but we
# reach the container directly on the shared network here)
rpp_epp_port: 743
rpp_epp_use_tls: true
# Accepts any certificate for any name, so a man-in-the-middle goes unnoticed.
# For test backends only: this one is self-signed and rpp_epp_host is not in its SANs.
rpp_epp_tls_insecure_skip_verify: true
# timeout (secs) for requests sent to EPP server
#rpp_epp_timeout: 5

# By default, the RPP server does NOT cache the TCP connection to the EPP server.
# This means for every request, a new EPP connection is created: login, send command, logout.
# This is stateless and simple, but less performant.
#
# For better performance, you can enable connection caching by setting rpp_epp_connection_cache to true.
# When enabled, the EPP connection is kept open and reused for multiple requests.
# Note: Enabling caching makes the server stateful.
# rpp_epp_connection_cache: false

#  EPP objects this EPP client must advertise to EPP server
rpp_epp_objects:
  - "urn:ietf:params:xml:ns:contact-1.0"
  - "urn:ietf:params:xml:ns:host-1.0"
  - "urn:ietf:params:xml:ns:domain-1.0"

#  EPP extensions this EPP client must advertise to EPP server
rpp_epp_extensions:
  - "urn:ietf:params:xml:ns:secDNS-1.1"
  - "urn:ietf:params:xml:ns:idn-1.0"

# used to map EPP namespaces to readable names
rpp_epp_ns_map:
  epp: "urn:ietf:params:xml:ns:epp-1.0"
  domain: "urn:ietf:params:xml:ns:domain-1.0"
  contact: "urn:ietf:params:xml:ns:contact-1.0"
  host: "urn:ietf:params:xml:ns:host-1.0"
  secDNS: "urn:ietf:params:xml:ns:secDNS-1.1"
  rgp: "urn:ietf:params:xml:ns:rgp-1.0"
  idn: "urn:ietf:params:xml:ns:idn-1.0"

# The profile of this server: what it holds, which the proxy checks before any command. It extends the generic profile
# of its protocol (src/settings/profiles/epp.yaml, or rri.yaml) and states only what this server differs in: a map
# merges, a list or a value replaces. Another EPP server starts from `extends: epp` alone.
rpp_backend_profile:
  extends: epp
  # The EPP test server of EPP-server-docker holds all of RFC 5730 to 5733: nothing differs.

# Maps an LGR name, which json §6.4 asks for in `lgr`, to the IDN table id of the EPP IDN extension
# (urn:ietf:params:xml:ns:idn-1.0), one to one. A create with an `lgr` not listed is a 400. A domain whose table is not
# listed reads without `uName` and `lgr`. Without this map no `lgr` can be sent. The entry below fits the test backend,
# whose tables are `de` and `es`.
rpp_idn_lgr_tables:
  latn-1.0: de

# What the discovery document (GET /.well-known/rpp) states. Without all four, or with a value of the wrong shape,
# it answers 500. The values below are placeholders for the test deployment: an operator MUST replace them.
# Public base URL of this proxy, which clients prefix to every path. It must be an absolute https URL (core §22)
# and is never taken from the request. The proxy itself serves plain HTTP, so the https URL is that of the TLS
# termination in front of it. The one below is a local placeholder.
rpp_base_url: https://localhost:8000
# TLDs served (placeholder)
rpp_tlds:
  - example
# Name and operational status ("production", "test", "development") of this server (placeholders)
rpp_environment_name: rpp-epp-proxy.example
rpp_environment_status: test
